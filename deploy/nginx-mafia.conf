# Save as /etc/nginx/sites-available/mafia, then:
#   sudo ln -s /etc/nginx/sites-available/mafia /etc/nginx/sites-enabled/mafia
#   sudo nginx -t && sudo systemctl reload nginx
server {
    listen 80;
    server_name _;          # or e.g. mafia.home / your server's LAN IP

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # REQUIRED for live updates (Server-Sent Events). Without these,
        # phones only update after a long delay.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
}
